<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#0B0D17">
<title>LifeGrid · расписание</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  /* LifeGrid share viewer. All data comes from the URL fragment (#…), which is never sent to the server. */
  :root {
    --bg: #0B0D17; --surface: #151829; --surface-high: #1D2136; --outline: #272C45;
    --text: #E8EAF6; --muted: #8C93B0; --accent: #8B9CFF; --mint: #3EE6B5; --red: #FF6B81; --amber: #FFC870;
    --day: #1F4D30; --day-ink: #8EE0A8; --night: #2C3160; --night-ink: #B8C8FF; --off: #1A2034; --off-ink: #7F88A8;
    --today: #B8C0FF;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--text); }
  body { font: 15px/1.45 Manrope, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; -webkit-font-smoothing: antialiased; }
  .wrap { max-width: 720px; margin: 0 auto; padding: max(16px, env(safe-area-inset-top)) 16px 40px; }
  .brand { font-weight: 800; font-size: 13px; letter-spacing: .02em;
    background: linear-gradient(90deg, #3EE6B5, #4F8BFF, #8E5CFF); -webkit-background-clip: text; background-clip: text; color: transparent; }
  h1 { font-size: 26px; font-weight: 800; letter-spacing: -.02em; margin: 4px 0 2px; overflow-wrap: anywhere; }
  .sub { color: var(--muted); font-size: 13px; }
  .tabs { display: flex; gap: 8px; margin: 18px 0 14px; overflow-x: auto; }
  .tab { flex: none; border: 1px solid var(--outline); background: transparent; color: var(--text); font: inherit; font-weight: 600;
    padding: 8px 16px; border-radius: 999px; cursor: pointer; }
  .tab[aria-selected="true"] { background: var(--accent); border-color: var(--accent); color: #0E1230; }
  .card { background: var(--surface); border: 1px solid var(--outline); border-radius: 22px; padding: 16px; margin-bottom: 12px; }
  .nav { display: flex; align-items: center; gap: 8px; margin-bottom: 12px; }
  .nav .title { flex: 1; min-width: 0; }
  .nav .title b { display: block; font-size: 18px; }
  .btn { border: 1px solid var(--outline); background: var(--surface); color: var(--text); font: inherit; font-weight: 600;
    height: 40px; min-width: 40px; padding: 0 12px; border-radius: 14px; cursor: pointer; }
  .btn:active { background: var(--surface-high); }
  .chip { display: inline-block; font-size: 12px; font-weight: 700; padding: 2px 9px; border-radius: 999px; }
  .day h3 { margin: 0 0 8px; font-size: 15px; display: flex; gap: 8px; align-items: baseline; }
  .day h3 .date { color: var(--muted); font-weight: 500; font-size: 13px; }
  .day.today { border-color: var(--today); }
  .row { display: flex; gap: 12px; padding: 9px 0; border-top: 1px solid var(--outline); }
  .row:first-of-type { border-top: 0; }
  .time { width: 52px; flex: none; color: var(--muted); font-weight: 700; font-size: 13px; line-height: 1.3; }
  .bar { width: 4px; flex: none; border-radius: 2px; }
  .what { min-width: 0; flex: 1; }
  .what b { display: block; overflow-wrap: anywhere; }
  .meta { color: var(--muted); font-size: 13px; }
  .cancel b { text-decoration: line-through; color: var(--muted); }
  .empty { color: var(--muted); font-size: 13px; }
  .grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 5px; }
  .wd { text-align: center; color: var(--muted); font-size: 12px; font-weight: 700; padding-bottom: 2px; }
  .cell { aspect-ratio: 1 / 1.1; border-radius: 12px; display: flex; flex-direction: column; align-items: center; justify-content: center;
    font-weight: 700; border: 2px solid transparent; min-width: 0; }
  .cell small { font-size: 10px; font-weight: 600; opacity: .9; }
  .cell.out { opacity: .4; }
  .cell.is-today { border-color: var(--today); }
  .legend { display: flex; flex-wrap: wrap; gap: 14px; margin-top: 12px; font-size: 13px; color: var(--muted); }
  .legend i { display: inline-block; width: 12px; height: 12px; border-radius: 4px; margin-right: 6px; vertical-align: -1px; }
  .msg { text-align: center; padding: 48px 12px; color: var(--muted); }
  .msg b { display: block; color: var(--text); font-size: 18px; margin-bottom: 6px; }
  footer { margin-top: 24px; text-align: center; color: var(--muted); font-size: 12px; }
</style>
</head>
<body>
<div class="wrap">
  <div class="brand">LifeGrid</div>
  <h1 id="title">Расписание</h1>
  <div class="sub" id="subtitle"></div>
  <div class="tabs" id="tabs" role="tablist"></div>
  <main id="view"></main>
  <footer>Данные хранятся только в самой ссылке и не отправляются на сервер.</footer>
</div>
<script>
"use strict";
const DAY = 86400000;
const WD = ["Пн", "Вт", "Ср", "Чт", "Пт", "Сб", "Вс"];
const KIND = { LECTURE: "Лекция", SEMINAR: "Семинар", PRACTICE: "Практика", LAB: "Лабораторная", OTHER: "" };
const EVENT = {
  COLLOQUIUM: ["Коллоквиум", "#B39DDB"], MAKEUP: ["Отработка", "#FFAB70"], EXAM: ["Зачёт / экзамен", "#FF8A80"],
  TEST: ["Контрольная / тест", "#FFD54F"], SEMINAR: ["Семинар / практика", "#81D4FA"], CUSTOM: ["Событие", "#80CBC4"]
};
const SHIFT = {
  DAY: { label: "Работа", short: "День", bg: "var(--day)", ink: "var(--day-ink)" },
  NIGHT: { label: "Ночь", short: "Ночь", bg: "var(--night)", ink: "var(--night-ink)" },
  OFF: { label: "Выходной", short: "Вых", bg: "var(--off)", ink: "var(--off-ink)" }
};
const SUBJECT_COLORS = ["#8B9CFF", "#3EE6B5", "#FFB86B", "#F472B6", "#60A5FA", "#FACC15", "#C084FC", "#34D399", "#FB7185", "#22D3EE"];

// ---- dates as epoch days (UTC), like LocalDate.toEpochDay() in the app ----
const now = new Date();
const TODAY = Math.floor(Date.UTC(now.getFullYear(), now.getMonth(), now.getDate()) / DAY);
const mod = (a, n) => ((a % n) + n) % n;
const dow = e => mod(e + 3, 7) + 1;              // 1 = Monday … 7 = Sunday
const monday = e => e - (dow(e) - 1);
const toDate = e => new Date(e * DAY);
const fmt = (e, opts) => toDate(e).toLocaleDateString("ru-RU", Object.assign({ timeZone: "UTC" }, opts));
const hm = m => String(Math.floor(m / 60)).padStart(2, "0") + ":" + String(m % 60).padStart(2, "0");
const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

/** Same colour as in the app: Java String.hashCode of the lower-cased subject. */
function subjectColor(subject) {
  let h = 0;
  const s = subject.trim().toLowerCase();
  for (let i = 0; i < s.length; i++) h = (Math.imul(31, h) + s.charCodeAt(i)) | 0;
  return SUBJECT_COLORS[mod(h, SUBJECT_COLORS.length)];
}

// ---- timetable maths (mirror of ScheduleCalc in the app) ----
const weekNumber = (sch, e) => Math.trunc((monday(e) - monday(sch.a)) / 7) + 1;
const covers = (sch, e) => e >= sch.a && e <= sch.b;
function occurs(slot, sch, e) {
  if (!covers(sch, e) || dow(e) !== slot.w) return false;
  const odd = mod(weekNumber(sch, e), 2) === 1;
  return !slot.q || (slot.q === 1 ? odd : !odd);
}
/** The newest schedule whose period contains the day. */
const scheduleFor = (data, e) => (data.s || []).slice().reverse().find(s => covers(s, e));
function classesOn(data, e) {
  const out = [];
  (data.s || []).forEach(sch => (sch.c || []).forEach(slot => {
    if (occurs(slot, sch, e)) out.push({ slot, cancelled: (slot.x || []).includes(e) });
  }));
  return out.sort((a, b) => a.slot.f - b.slot.f);
}
const eventsOn = (data, e) => (data.e || []).filter(ev => ev.d === e);

function shiftOn(h, e) {
  const p = h.p.split(",").map(x => x.trim().toUpperCase()).filter(Boolean);
  return p.length ? p[mod(e - h.s, p.length)] : "OFF";
}

// ---- decoding: "#1.<base64url of raw-deflated JSON>" ----
async function decode(hash) {
  const m = /^#?(\d+)\.([A-Za-z0-9_-]+)$/.exec(hash.trim());
  if (!m) throw new Error("bad");
  if (m[1] !== "1") throw new Error("version");
  const b64 = m[2].replace(/-/g, "+").replace(/_/g, "/") + "===".slice((m[2].length + 3) % 4);
  const bytes = Uint8Array.from(atob(b64), c => c.charCodeAt(0));
  const stream = new Blob([bytes]).stream().pipeThrough(new DecompressionStream("deflate-raw"));
  return JSON.parse(await new Response(stream).text());
}

// ---- rendering ----
const view = document.getElementById("view");
const state = { tab: null, week: monday(TODAY), month: null };

function message(title, text) {
  document.getElementById("tabs").innerHTML = "";
  view.innerHTML = `<div class="msg"><b>${esc(title)}</b>${esc(text)}</div>`;
}

function renderTabs(data) {
  const tabs = [];
  if (data.s && data.s.some(s => (s.c || []).length)) tabs.push(["classes", "Пары"]);
  if (data.e && data.e.length) tabs.push(["events", "События"]);
  if (data.h) tabs.push(["shifts", "Смены"]);
  if (!state.tab || !tabs.some(t => t[0] === state.tab)) state.tab = tabs.length ? tabs[0][0] : null;
  document.getElementById("tabs").innerHTML = tabs.map(([id, label]) =>
    `<button class="tab" role="tab" aria-selected="${id === state.tab}" data-tab="${id}">${label}</button>`).join("");
  return tabs.length;
}

function classRow(c) {
  const s = c.slot;
  const color = subjectColor(s.n);
  const place = [s.r && "ауд. " + s.r, s.g, s.p].filter(Boolean).join(" · ");
  const kind = KIND[s.k] || "";
  const parity = s.q === 1 ? "числитель" : s.q === 2 ? "знаменатель" : "";
  return `<div class="row${c.cancelled ? " cancel" : ""}">
    <div class="time">${hm(s.f)}<br><span style="font-weight:500">${hm(s.u)}</span></div>
    <div class="bar" style="background:${c.cancelled ? "var(--outline)" : color}"></div>
    <div class="what"><b>${esc(s.n)}</b>
      <div class="meta">${esc([c.cancelled ? "отменена" : kind, parity].filter(Boolean).join(" · "))}</div>
      ${place ? `<div class="meta">${esc(place)}</div>` : ""}</div></div>`;
}

function eventRow(ev, withDate) {
  const [label, color] = EVENT[ev.y] || EVENT.CUSTOM;
  const when = [withDate ? fmt(ev.d, { weekday: "short", day: "numeric", month: "short" }) : "", ev.m != null ? hm(ev.m) : ""].filter(Boolean).join(", ");
  return `<div class="row">
    <div class="time">${esc(ev.m != null ? hm(ev.m) : "")}</div>
    <div class="bar" style="background:${color}"></div>
    <div class="what"><span class="chip" style="background:${color}22;color:${color}">${esc(label)}</span>
      <b style="margin-top:4px">${esc(ev.t || ev.n)}</b>
      <div class="meta">${esc([ev.t ? ev.n : "", ev.r, withDate ? when : ""].filter(Boolean).join(" · "))}</div></div></div>`;
}

function renderClasses(data) {
  const mon = state.week, sun = mon + 6;
  const sch = scheduleFor(data, mon) || scheduleFor(data, mon + 4) || scheduleFor(data, sun);
  const range = fmt(mon, { day: "numeric", month: fmt(mon, { month: "numeric" }) === fmt(sun, { month: "numeric" }) ? undefined : "long" })
    + " – " + fmt(sun, { day: "numeric", month: "long" });
  let info = "нет расписания на эту неделю";
  if (sch) {
    const n = weekNumber(sch, Math.max(mon, sch.a));
    info = `неделя ${n} · ${mod(n, 2) === 1 ? "числитель" : "знаменатель"}${sch.t ? " · " + esc(sch.t) : ""}`;
  }
  let html = `<div class="nav"><button class="btn" data-week="-1" aria-label="Предыдущая неделя">‹</button>
    <div class="title"><b>${esc(range)}</b><span class="sub">${info}</span></div>
    ${mon !== monday(TODAY) ? `<button class="btn" data-week="0">Сегодня</button>` : ""}
    <button class="btn" data-week="1" aria-label="Следующая неделя">›</button></div>`;
  for (let e = mon; e <= sun; e++) {
    const cls = classesOn(data, e), evs = eventsOn(data, e);
    if (!cls.length && !evs.length && dow(e) >= 6) continue;   // empty weekend days are skipped
    html += `<section class="card day${e === TODAY ? " today" : ""}"><h3>${WD[dow(e) - 1]}
      <span class="date">${esc(fmt(e, { day: "numeric", month: "long" }))}${e === TODAY ? " · сегодня" : ""}</span></h3>
      ${cls.map(classRow).join("")}${evs.map(ev => eventRow(ev, false)).join("")}
      ${!cls.length && !evs.length ? `<div class="empty">Пар нет</div>` : ""}</section>`;
  }
  view.innerHTML = html;
}

function renderEvents(data) {
  const upcoming = (data.e || []).filter(ev => ev.d >= TODAY);
  if (!upcoming.length) { view.innerHTML = `<div class="msg"><b>Предстоящих событий нет</b>На момент отправки ссылки.</div>`; return; }
  const byDay = {};
  upcoming.forEach(ev => (byDay[ev.d] = byDay[ev.d] || []).push(ev));
  view.innerHTML = Object.keys(byDay).map(Number).sort((a, b) => a - b).map(d => {
    const left = d - TODAY;
    const rel = left === 0 ? " · сегодня" : left === 1 ? " · завтра" : ` · через ${left} дн.`;
    return `<section class="card day${d === TODAY ? " today" : ""}"><h3>${esc(fmt(d, { weekday: "long", day: "numeric", month: "long" }))}
      <span class="date">${rel}</span></h3>${byDay[d].map(ev => eventRow(ev, false)).join("")}</section>`;
  }).join("");
}

function renderShifts(data) {
  const h = data.h;
  if (state.month == null) { const t = toDate(TODAY); state.month = t.getUTCFullYear() * 12 + t.getUTCMonth(); }
  const y = Math.floor(state.month / 12), m = mod(state.month, 12);
  const first = Math.floor(Date.UTC(y, m, 1) / DAY), last = Math.floor(Date.UTC(y, m + 1, 1) / DAY) - 1;
  const start = monday(first), end = last + (7 - dow(last));
  const counts = { DAY: 0, NIGHT: 0, OFF: 0 };
  let cells = WD.map(d => `<div class="wd">${d}</div>`).join("");
  for (let e = start; e <= end; e++) {
    const code = shiftOn(h, e), st = SHIFT[code] || SHIFT.OFF, inMonth = e >= first && e <= last;
    if (inMonth) counts[code in counts ? code : "OFF"]++;
    cells += `<div class="cell${inMonth ? "" : " out"}${e === TODAY ? " is-today" : ""}" style="background:${st.bg};color:${st.ink}"
      title="${esc(fmt(e, { day: "numeric", month: "long" }) + " — " + st.label)}">${toDate(e).getUTCDate()}<small>${st.short}</small></div>`;
  }
  const monthName = toDate(first).toLocaleDateString("ru-RU", { timeZone: "UTC", month: "long" });
  const monthTitle = monthName.charAt(0).toUpperCase() + monthName.slice(1) + " " + y;
  const thisMonth = (() => { const t = toDate(TODAY); return t.getUTCFullYear() * 12 + t.getUTCMonth(); })();
  view.innerHTML = `<div class="nav"><button class="btn" data-month="-1" aria-label="Предыдущий месяц">‹</button>
    <div class="title"><b>${esc(monthTitle)}</b><span class="sub">${esc(h.t || "График смен")}</span></div>
    ${state.month !== thisMonth ? `<button class="btn" data-month="0">Сегодня</button>` : ""}
    <button class="btn" data-month="1" aria-label="Следующий месяц">›</button></div>
    <div class="card"><div class="grid">${cells}</div>
    <div class="legend"><span><i style="background:var(--day)"></i>Работа (день): ${counts.DAY}</span>
      ${counts.NIGHT ? `<span><i style="background:var(--night)"></i>Ночь: ${counts.NIGHT}</span>` : ""}
      <span><i style="background:var(--off)"></i>Выходной: ${counts.OFF}</span></div></div>`;
}

function render(data) {
  if (!renderTabs(data)) { message("Пустая ссылка", "В ней нет ни пар, ни событий, ни графика смен."); return; }
  ({ classes: renderClasses, events: renderEvents, shifts: renderShifts })[state.tab](data);
}

async function main() {
  if (!location.hash || location.hash.length < 4) {
    message("Здесь показывается расписание из LifeGrid", "Откройте ссылку, которую вам прислали, — данные находятся в самой ссылке.");
    return;
  }
  let data;
  try {
    data = await decode(location.hash);
  } catch (e) {
    message(e.message === "version" ? "Ссылка из более новой версии LifeGrid" : "Ссылка повреждена",
      e.message === "version" ? "Обновите эту страницу на сайте." : "Возможно, мессенджер обрезал её — попросите прислать ещё раз.");
    return;
  }
  document.getElementById("title").textContent = data.t || "Расписание";
  document.title = (data.t || "Расписание") + " · LifeGrid";
  document.getElementById("subtitle").textContent = "Снимок от " + fmt(data.d, { day: "numeric", month: "long", year: "numeric" });
  document.addEventListener("click", ev => {
    const b = ev.target.closest("button");
    if (!b) return;
    if (b.dataset.tab) state.tab = b.dataset.tab;
    if (b.dataset.week) state.week = b.dataset.week === "0" ? monday(TODAY) : state.week + 7 * Number(b.dataset.week);
    if (b.dataset.month) state.month = b.dataset.month === "0" ? null : state.month + Number(b.dataset.month);
    render(data);
  });
  render(data);
}
window.addEventListener("hashchange", () => location.reload());
main();
</script>
</body>
</html>
